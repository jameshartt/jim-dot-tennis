# golangci-lint v2 configuration. The version is pinned in the Makefile
# (GOLANGCI_LINT_VERSION); `make lint` and CI both use it. Migrated from v1 with
# `golangci-lint migrate`. The v1 default linters (errcheck, govet, staticcheck,
# ineffassign, unused) stay on by default; gosimple and typecheck were folded
# into staticcheck and the compiler in v2.
version: "2"
run:
  timeout: 5m
  go: "1.26"
linters:
  enable:
    - goconst
    - misspell
  disable:
    - depguard
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        - (*database/sql.Tx).Rollback
        - (*encoding/json.Encoder).Encode
        - (net/http.ResponseWriter).Write
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Fprintln
    goconst:
      min-occurrences: 5
      ignore-string-values:
        - 'true|false|clear|error|success'
    staticcheck:
      # v2 folded gosimple into staticcheck and added the QF* quick-fix style
      # suggestions; they were not enforced under v1, so they stay off. The rest
      # is the v2 default set.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
        - -QF1003
        - -QF1008
        - -QF1012
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
        text: .*
      - linters:
          - errcheck
        text: DeleteSubscription
      # Repeated literals in tests are fine.
      - linters:
          - goconst
        path: _test\.go
      # Template data keys / JSON field names repeat across handlers by nature.
      - linters:
          - goconst
        text: 'string `(Clubs|ActiveSeason|Player|AuthToken|status|Available|Divisions|User|HomeClubName|url|Success|help)` has'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - jim-dot-tennis
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
