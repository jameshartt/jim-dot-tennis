# Reference production deployment for jim.tennis (jim-dot-tennis + CourtHive).
#
# This is the stack production actually runs, with every secret and the domain
# expressed as a variable. Run it from this directory:
#
#   cd deploy
#   cp .env.example .env        # then fill in every value
#   docker compose up -d
#
# The app runs the published image ghcr.io/jameshartt/jim-dot-tennis at the
# version in JIM_DOT_TENNIS_VERSION (pinned default below, no leading "v"):
# nothing is compiled on your server. To upgrade, read the "Upgrade notes" for
# the new version in CHANGELOG.md, set the variable in .env and run
# `docker compose pull app && docker compose up -d app`. The app takes a backup
# before it migrates. To build the app from source instead (development), use
# the repository's root docker-compose.yml. The CourtHive server below is still
# built from its source checkout.
#
# Compose reads deploy/.env automatically (it sits next to this file).
# Required variables use ${VAR:?message}: a missing value stops compose with a
# clear error instead of silently starting with an empty secret.
#
# Expected directory layout (paths below are relative to this file):
#
#   <parent>/
#     jim-dot-tennis/              this repository (checkout or rsync target)
#       deploy/                    this file, Caddyfile, .env
#     competition-factory-server/  CourtHive API server source (built here)
#     TMX/dist/                    pre-built TMX frontend, served at /tournaments
#     courthive-public/dist/       pre-built public viewer, served at /public
#
# NOTE: scripts/deploy-app.sh does NOT sync this file or the Caddyfile to the
# server; changing the running stack is always a deliberate, manual step.
#
# Named volumes below carry fixed `name:` values. Do not rename them: a new name
# means a new, empty volume and the existing data is orphaned.

# Fixed project name so network/container labels do not depend on the directory
# this file lives in (production's project is named after its checkout directory).
name: jim-dot-tennis

services:
  # The jim-dot-tennis app, from the published release image
  app:
    image: ghcr.io/jameshartt/jim-dot-tennis:${JIM_DOT_TENNIS_VERSION:-0.1.0}
    container_name: jim-dot-tennis
    restart: unless-stopped
    volumes:
      - tennis-data:/app/data
    environment:
      - PORT=8080
      - DB_TYPE=sqlite3
      - DB_PATH=/app/data/tennis.db
      - APP_ENV=production # session cookies are Secure; requires a valid https PUBLIC_URL to start
      # The instance's public address (passkeys, links, calendar UIDs); required, set it in .env.
      - PUBLIC_URL=${PUBLIC_URL:-}
      # Optional: unset means the app generates this instance's own code.
      - WRAPPED_ACCESS_PASSWORD=${WRAPPED_ACCESS_PASSWORD:-}
      # Set HOME_CLUB_ID (preferred) or HOME_CLUB_NAME; the app refuses to start with neither.
      - HOME_CLUB_ID=${HOME_CLUB_ID:-}
      - HOME_CLUB_NAME=${HOME_CLUB_NAME:-}
      - BHPLTA_CLUB_CODE=${BHPLTA_CLUB_CODE:-}
      # Optional; empty means the app's built-in default / feature off.
      - HOME_CLUB_LOGO_PATH=${HOME_CLUB_LOGO_PATH:-}
      - LEAGUE_TABLES_URL=${LEAGUE_TABLES_URL:-}
      - MY_TENNIS_ENABLED=${MY_TENNIS_ENABLED:-}
      # Backups are made by the app itself into /app/data/backups (daily, plus
      # one before every upgrade; see docs/PRODUCTION_QUICK_REFERENCE.md section 9).
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-}
      - BACKUP_KEEP=${BACKUP_KEEP:-}
      - BACKUP_DIR=${BACKUP_DIR:-}
    networks:
      - tennis-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for CourtHive
  redis:
    image: redis:7-alpine
    container_name: courthive-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - tennis-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Postgres for CourtHive
  postgres:
    image: postgres:18-alpine
    container_name: courthive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: courthive
      POSTGRES_PASSWORD: ${COURTHIVE_PG_PASSWORD:?set COURTHIVE_PG_PASSWORD in deploy/.env (openssl rand -hex 24)}
      POSTGRES_DB: courthive
    volumes:
      - courthive-pg-data:/var/lib/postgresql
    networks:
      - tennis-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U courthive']
      interval: 10s
      timeout: 5s
      retries: 5

  # CourtHive API Server
  courthive-server:
    build:
      context: ../../competition-factory-server
      dockerfile: Dockerfile
    container_name: courthive-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - courthive-data:/app/data
      - courthive-cache:/app/cache
    environment:
      - NODE_ENV=production
      - APP_NAME=Competition Factory Server
      - APP_MODE=production
      - APP_PORT=8383
      - STORAGE_PROVIDER=postgres
      - JWT_SECRET=${COURTHIVE_JWT_SECRET:?set COURTHIVE_JWT_SECRET in deploy/.env (openssl rand -hex 32)}
      - JWT_VALIDITY=2h
      - TRACKER_CACHE=/app/cache
      - REDIS_URL=redis://redis:6379
      - REDIS_TTL=28800000
      - REDIS_HOST=redis
      - REDIS_USERNAME=
      - REDIS_PASSWORD=
      - REDIS_PORT=6379
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=courthive
      - PG_PASSWORD=${COURTHIVE_PG_PASSWORD:?set COURTHIVE_PG_PASSWORD in deploy/.env (openssl rand -hex 24)}
      - PG_DATABASE=courthive
    networks:
      - tennis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8383/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Caddy reverse proxy with SSL
  caddy:
    image: caddy:2-alpine
    # Production's docker-compose.override.yml renames this container; the name
    # below is what actually runs there.
    container_name: jim-dot-tennis-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      courthive-server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../../TMX/dist:/srv/tournaments
      - ../../courthive-public/dist:/srv/public
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in deploy/.env (the public hostname, e.g. tennis.example.org)}
    networks:
      - tennis-network

networks:
  tennis-network:
    driver: bridge

volumes:
  tennis-data:
    name: jim-dot-tennis-data
  redis-data:
    name: courthive-redis-data
  courthive-data:
    name: courthive-data
  courthive-cache:
    name: courthive-cache
  caddy-data:
    name: caddy-data
  caddy-config:
    name: caddy-config
  courthive-pg-data:
    name: courthive-pg-data
